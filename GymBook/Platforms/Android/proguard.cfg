# R8 rules for the phone app, on top of ../Android.R8.cfg.

# Samsung Health's Data SDK is called through raw JNI by class, method and field name (SamsungHealthData.cs), not a
# binding, so the trimmer doesn't know about any of it.
-keep class com.samsung.android.sdk.health.data.** { *; }
-keep class kotlinx.parcelize.** { *; }
