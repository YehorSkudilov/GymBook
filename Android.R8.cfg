# R8 rules for the release builds of both Android apps (GymBook, GymBook.Wear), through Android.R8.targets.

# The SDK's own rules (proguard_xamarin.cfg in Xamarin.Android.Build.Tasks.dll), less its -dontobfuscate, which
# Android.R8.targets drops along with the SDK's copy.
-keep class android.support.multidex.MultiDexApplication { <init>(); }
-keep class net.dot.jni.** { *; <init>(); }
-keep class mono.MonoRuntimeProvider* { *; <init>(...); }
-keep class mono.MonoPackageManager { *; <init>(...); }
-keep class mono.MonoPackageManager_Resources { *; <init>(...); }
-keep class mono.android.** { *; <init>(...); }
-keep class mono.java.** { *; <init>(...); }
-keep class mono.javax.** { *; <init>(...); }
-keep class net.dot.jni.ManagedPeer { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_TrustManager { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_TrustManager_FakeSSLSession { *; <init>(...); }
-keep class xamarin.android.net.ServerCertificateCustomValidator_AlwaysAcceptingHostnameVerifier { *; <init>(...); }
-keep class android.runtime.** { <init>(...); }
-keep class assembly_mono_android.android.runtime.** { <init>(...); }
-keep class md52ce486a14f4bcd95899665e9d932190b.** { *; <init>(...); }
-keepclassmembers class md52ce486a14f4bcd95899665e9d932190b.** { *; <init>(...); }
-keep class net.dot.android.crypto.** { *; <init>(...); }
-keepclassmembers class * extends android.view.View {
   *** set*(...);
   <init>(android.content.Context,android.util.AttributeSet);
   <init>(android.content.Context,android.util.AttributeSet,int);
}

# C# calls Java by name through JNI, so whatever it calls has to keep its name. The trimmer writes rules for every bound
# class and method the app still uses (proguard_project_references.cfg), but not for interfaces or fields: keep those.
-keep interface * { *; }
-keepclassmembers class * {
   public <fields>;
   protected <fields>;
}

# Generics and annotations, which Gson and Kotlin read at run time.
-keepattributes Signature,InnerClasses,EnclosingMethod,*Annotation*

# Libraries that look fields up by name: lite protobufs (shaded into Health Connect and Wear Tiles) and atomic updaters.
-keepclassmembers class * extends **.GeneratedMessageLite { <fields>; }
-keepclassmembers class * { volatile <fields>; }

# Coroutines finds its Android dispatcher through META-INF/services, which is packaged from the original jars, not R8's
# output, so the class it names has to keep its name.
-keep class kotlinx.coroutines.android.** { *; }
-keepnames class kotlinx.coroutines.internal.MainDispatcherFactory
-keepnames class kotlinx.coroutines.CoroutineExceptionHandler

# Gson's TypeToken subclasses carry the generic type it reads.
-keep,allowobfuscation,allowshrinking class com.google.gson.reflect.TypeToken
-keep,allowobfuscation,allowshrinking class * extends com.google.gson.reflect.TypeToken
