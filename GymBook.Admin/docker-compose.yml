# The admin site. Settings come from .env next to this file (see .env.example); on the server the Publish Admin
# workflow writes it.
#
#   docker compose up -d --build
#
# Its own project name, so it never touches the API's or the website's containers.
name: gymbook-admin

services:
  admin:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # Plain HTTP on every interface; the reverse proxy terminates TLS in front of it.
    ports:
      - "${ADMIN_PORT:?ADMIN_PORT is not set}:3000"
