name: Publish Admin App

# Builds the admin app (GymBook.Admin) for Android and Windows, the same way PublishApp.yml builds the GymBook app,
# minus the stores: the builds are only attached to the run as artifacts (Summary page -> Artifacts).
permissions:
  contents: read

env:
  # Checked out into its own folder next to AppSkeleton (referenced as ..\..\AppSkeleton), as in PublishApp.yml.
  PROJECT_PATH: GymBook/GymBook.Admin/GymBook.Admin.csproj

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Android (.apk)"
        type: boolean
        default: true

      build_windows:
        description: "Windows (.exe zip)"
        type: boolean
        default: true

  # Lets Publish.yml call this as a reusable workflow - see that file's publish-admin job.
  workflow_call:
    inputs:
      build_android:
        type: boolean
        default: true
      build_windows:
        type: boolean
        default: true

jobs:

  # ==================================================
  # BUILD ANDROID
  # ==================================================
  build-android:
    if: ${{ inputs.build_android }}
    runs-on: windows-latest

    steps:
      - name: Checkout GymBook
        uses: actions/checkout@v6
        with:
          path: GymBook

      - name: Checkout AppSkeleton
        uses: actions/checkout@v6
        with:
          repository: YehorSkudilov/AppSkeleton
          token: ${{ secrets.REPO_TOKEN }}
          path: AppSkeleton

      # =========================
      # .NET + MAUI
      # =========================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The runner's Visual Studio usually has MAUI already. Any `dotnet workload install` also reinstalls every
      # workload Visual Studio registered (iOS, Mac Catalyst, wasm...), several minutes, so only install when it's
      # really missing. Visual Studio registers MAUI for Android as "android" next to a "maui-*" workload (which
      # brings the shared MAUI SDK), never as "maui-android", so either counts.
      - name: Install MAUI Android workload
        shell: pwsh
        run: |
          $workloads = dotnet workload list | Out-String
          Write-Host $workloads
          $hasMauiAndroid = $workloads -match '(?m)^\s*maui-android\s'
          $hasAndroidAndMaui = ($workloads -match '(?m)^\s*android\s') -and ($workloads -match '(?m)^\s*maui(-\w+)?\s')
          if ($hasMauiAndroid -or $hasAndroidAndMaui) {
            Write-Host "MAUI for Android already installed"
          } else {
            dotnet workload install maui-android --skip-manifest-update
          }

      # =========================
      # KEYSTORE
      # =========================

      # The GymBook app's keystore (ANDROID_KEYSTORE_BASE64), so each new APK installs over the last one.
      - name: Restore keystore
        id: keystore
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")) {
            throw "ANDROID_KEYSTORE_BASE64 secret is not set"
          }

          $keystore = Join-Path $env:RUNNER_TEMP "gymbook.keystore"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}"))

          echo "path=$keystore" >> $env:GITHUB_OUTPUT

      # =========================
      # BUILD + SIGNING
      # =========================

      # APK only (no AAB: it isn't going to Google Play). The run number is the version code, so every build counts
      # as newer than the one installed.
      - name: Publish Android APK
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -f net10.0-android `
            /p:AndroidPackageFormat=apk `
            /p:AndroidKeyStore=true `
            "/p:AndroidSigningKeyStore=${{ steps.keystore.outputs.path }}" `
            "/p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEYALIAS_NAME }}" `
            "/p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEYALIAS_PASS }}" `
            "/p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASS }}" `
            "/p:ApplicationVersion=${{ github.run_number }}" `
            "/p:ApiBaseUrl=${{ vars.API_BASE_URL }}"

      # =========================
      # FIND APK
      # =========================

      - name: Find APK
        id: find_apk
        shell: pwsh
        run: |
          $file = Get-ChildItem -Recurse -Filter "*-Signed.apk" |
            Where-Object { $_.FullName -like "*Release*" } |
            Select-Object -First 1

          if ($null -eq $file) {
            $file = Get-ChildItem -Recurse -Filter *.apk |
              Select-Object -First 1
          }

          if ($null -eq $file) {
            Write-Host "No APK found"
            Get-ChildItem -Recurse -Filter *.apk
            throw "APK not found"
          }

          $posix = $file.FullName -replace "\\", "/"

          Write-Host "APK: $posix"
          echo "file=$posix" >> $env:GITHUB_OUTPUT

      # =========================
      # UPLOAD ARTIFACT
      # =========================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-android-apk
          path: ${{ steps.find_apk.outputs.file }}

  # ==================================================
  # BUILD WINDOWS
  # ==================================================
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest

    steps:
      - name: Checkout GymBook
        uses: actions/checkout@v6
        with:
          path: GymBook

      - name: Checkout AppSkeleton
        uses: actions/checkout@v6
        with:
          repository: YehorSkudilov/AppSkeleton
          token: ${{ secrets.REPO_TOKEN }}
          path: AppSkeleton

      # =========================
      # .NET + MAUI
      # =========================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The runner's Visual Studio usually has MAUI already. Any `dotnet workload install` also reinstalls every
      # workload Visual Studio registered (iOS, Mac Catalyst, Android...), so only install when it's really missing.
      - name: Install MAUI Windows workload
        shell: pwsh
        run: |
          dotnet workload list
          if (dotnet workload list | Select-String -Pattern '^\s*maui-windows\s' -Quiet) {
            Write-Host "maui-windows already installed"
          } else {
            dotnet workload install maui-windows --skip-manifest-update
          }

      # =========================
      # BUILD
      # =========================

      # Unpackaged and self-contained (the .NET and Windows App SDK runtimes included) instead of the GymBook app's
      # MSIX: unzip anywhere and run GymBook.Admin.exe, nothing to install or sign.
      - name: Publish Windows
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -o "$env:RUNNER_TEMP/admin-windows" `
            /p:RuntimeIdentifierOverride=win-x64 `
            /p:WindowsPackageType=None `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            "/p:ApplicationVersion=${{ github.run_number }}" `
            "/p:ApiBaseUrl=${{ vars.API_BASE_URL }}"

      # =========================
      # UPLOAD ARTIFACT
      # =========================

      # Uploaded as a folder; GitHub zips it for download.
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-windows
          path: ${{ runner.temp }}/admin-windows
