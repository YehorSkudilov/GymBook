name: Publish API

on:
  workflow_dispatch:

jobs:

# ==================================================
# DEPLOY API
# ==================================================
  deploy-api:
    runs-on: ubuntu-latest

    # Only deploy from the main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            echo "Deploying GymBook API..."

            # One-time setup on the server: git clone the repo to /opt/GymBook.
            cd /opt/GymBook

            echo "Pulling latest code..."
            git fetch origin && git reset --hard origin/main

            cd GymBook.Api

            # Only what has no default in appsettings.json - an empty value here would override it.
            echo "Writing .env..."
            cat > .env <<'ENVEOF'
            # Postgres
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB }}

            # JWT (at least 32 characters)
            Jwt__SigningKey=${{ secrets.JWT_SIGNING_KEY }}

            # Swagger UI basic auth
            SwaggerAuth__Username=${{ vars.SWAGGER_AUTH_USERNAME }}
            SwaggerAuth__Password=${{ secrets.SWAGGER_AUTH_PASSWORD }}

            # Host-side port the reverse proxy forwards to (consumed by docker-compose.prod.yml)
            API_PORT=${{ vars.API_PORT }}
            ENVEOF

            echo "Building latest image..."
            docker compose -f docker-compose.prod.yml build --pull

            echo "Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for the API to report healthy..."
            PORT=$(grep '^API_PORT=' .env | cut -d= -f2)
            for i in $(seq 1 30); do
              if curl -fsS "http://172.17.0.1:$PORT/health" > /dev/null; then
                echo "API is up."
                break
              fi
              if [ "$i" = 30 ]; then
                echo "API did not become healthy; recent logs:"
                docker compose -f docker-compose.prod.yml logs --tail 100 api
                exit 1
              fi
              sleep 2
            done

            echo "Removing dangling images..."
            docker image prune -f

            echo "Deployment complete!"
