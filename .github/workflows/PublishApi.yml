name: Publish API

on:
  workflow_dispatch:
  # Lets Publish.yml call this as a reusable workflow instead of keeping its own copy
  # of the deploy script - see that file's deploy-api job.
  workflow_call:

jobs:

# ==================================================
# DEPLOY API
# ==================================================
  deploy-api:
    runs-on: ubuntu-latest

    # Only deploy from the main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Room to wait for the other deploys on the server (see the deploy lock below).
          command_timeout: 40m
          script: |
            set -e

            echo "Deploying GymBook API..."

            # One-time setup on the server: git clone the repo to /opt/GymBook.
            cd /opt/GymBook

            echo "Pulling latest code..."
            # The lock keeps deploys running side by side (API, website, admin) from resetting it at the same time.
            flock /tmp/gymbook-deploy-git.lock -c "git fetch origin && git reset --hard origin/main"

            cd GymBook.Api

            # Every API setting lives here (there are no appsettings files) - see GymBook.Api/.env.example.
            # The connection string, migrations and trusted proxy network are set by docker-compose.yml itself.
            echo "Writing .env..."
            cat > .env <<'ENVEOF'
            # Logging
            Logging__LogLevel__Default=Information
            Logging__LogLevel__Microsoft.AspNetCore=Warning

            # Postgres
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB }}

            # JWT (signing key at least 32 characters)
            Jwt__Issuer=gymbook-api
            Jwt__Audience=gymbook-app
            Jwt__SigningKey=${{ secrets.JWT_SIGNING_KEY }}
            Jwt__AccessTokenMinutes=15
            Jwt__RefreshTokenDays=30

            # Swagger UI basic auth
            SwaggerAuth__Username=${{ vars.SWAGGER_AUTH_USERNAME }}
            SwaggerAuth__Password=${{ secrets.SWAGGER_AUTH_PASSWORD }}

            # ChatGPT for AI-generated plans (leave the secret unset to turn them off)
            OpenAI__ApiKey=${{ secrets.OPENAI_API_KEY }}
            OpenAI__Model=${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
            OpenAI__ReasoningEffort=${{ vars.OPENAI_REASONING_EFFORT || 'low' }}
            OpenAI__TimeoutSeconds=90

            # Food search databases (leave a secret unset to leave that database out)
            Usda__ApiKey=${{ secrets.USDA_API_KEY }}
            FatSecret__ClientId=${{ secrets.FATSECRET_CLIENT_ID }}
            FatSecret__ClientSecret=${{ secrets.FATSECRET_CLIENT_SECRET }}

            # Email for password reset and email change codes (leave SMTP_HOST unset to turn them off)
            Smtp__Host=${{ vars.SMTP_HOST }}
            Smtp__Port=${{ vars.SMTP_PORT || '587' }}
            Smtp__Username=${{ vars.SMTP_USERNAME }}
            Smtp__Password=${{ secrets.SMTP_PASSWORD }}
            Smtp__FromAddress=${{ vars.SMTP_FROM_ADDRESS }}
            Smtp__FromName=Gym Book

            # Google sign-in: Web OAuth client ID (leave unset to turn it off)
            Google__ClientId=${{ vars.GOOGLE_WEB_CLIENT_ID }}
            # iOS OAuth client ID: the iOS app's tokens are addressed to it (leave unset without iOS sign-in)
            Google__IosClientId=${{ vars.GOOGLE_IOS_CLIENT_ID }}

            # Gym Book Pro subscriptions, checked with each store (a store stays off while its settings are empty)
            GooglePlay__PackageName=${{ vars.ANDROID_PACKAGE_NAME || 'com.yehorskudilov.gymbook' }}
            GooglePlay__ServiceAccountJson=${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
            GooglePlay__NotificationToken=${{ secrets.GOOGLE_PLAY_NOTIFICATION_TOKEN }}
            AppStore__BundleId=${{ vars.IOS_BUNDLE_ID || 'com.yehorskudilov.gymbook' }}
            AppStore__IssuerId=${{ vars.APP_STORE_ISSUER_ID }}
            AppStore__KeyId=${{ vars.APP_STORE_KEY_ID }}
            AppStore__PrivateKey=${{ secrets.APP_STORE_PRIVATE_KEY_BASE64 }}
            AppStore__NotificationToken=${{ secrets.APP_STORE_NOTIFICATION_TOKEN }}
            MicrosoftStore__TenantId=${{ vars.MICROSOFT_STORE_TENANT_ID }}
            MicrosoftStore__ClientId=${{ vars.MICROSOFT_STORE_CLIENT_ID }}
            MicrosoftStore__ClientSecret=${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}

            # Admin app: accounts made SuperAdmin at startup (comma-separated; sign up in the app first)
            Admin__BootstrapEmails=${{ vars.ADMIN_BOOTSTRAP_EMAILS }}

            # Rate limits
            RateLimiting__AuthPerMinute=10

            # Host-side port the reverse proxy forwards to (consumed by docker-compose.yml)
            API_PORT=${{ vars.API_PORT }}

            # Loopback-only host port of the database (consumed by docker-compose.yml); kept off 5432 so it
            # can't clash with a Postgres installed on the server itself
            DB_PORT=${{ vars.DB_PORT || '55432' }}
            ENVEOF

            # One Docker deploy at a time on this server, across BudgetBuddy and GymBook: builds pulling the same base
            # layers and another deploy's image prune at once corrupt each other ("failed commit on ref layer-sha256",
            # "No such image"). Held until this script ends.
            echo "Waiting for other deploys on this server..."
            exec 9>/tmp/server-docker-deploy.lock
            flock 9

            echo "Building latest image..."
            docker compose build --pull

            echo "Restarting containers..."
            docker compose up -d --remove-orphans

            echo "Waiting for the API to report healthy..."
            PORT=$(grep '^API_PORT=' .env | cut -d= -f2)
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$PORT/health" > /dev/null; then
                echo "API is up."
                break
              fi
              if [ "$i" = 30 ]; then
                echo "API did not become healthy; recent logs:"
                docker compose logs --tail 100 api
                exit 1
              fi
              sleep 2
            done

            echo "Removing dangling images..."
            docker image prune -f

            echo "Deployment complete!"
